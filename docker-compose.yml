networks:
  ecommerce-net:
    driver: bridge

services:
  api-gateway:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ecommerce-net

  consul:
    image: hashicorp/consul:1.19
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"
    networks:
      - ecommerce-net

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}" ]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  user-service:
    build: ./services/user-service
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_NAME: ${USER_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      CONSUL_URL: http://consul:8500
    depends_on:
      user-db:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - ecommerce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/users`)"
      - "traefik.http.services.user-service.loadbalancer.server.port=4000"
      - "traefik.http.middlewares.user-strip.stripprefix.prefixes=/api/users"
      - "traefik.http.routers.user-service.middlewares=user-strip"

    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "user-service"

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME}
      POSTGRES_USER: ${PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER} -d ${PRODUCT_DB_NAME}" ]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  product-service:
    build: ./services/product-service
    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_USER: ${PRODUCT_DB_USER}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      DB_NAME: ${PRODUCT_DB_NAME}
      PORT: 5000
      CONSUL_URL: http://consul:8500
    depends_on:
      product-db:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - ecommerce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.product-service.rule=PathPrefix(`/api/products`)"
      - "traefik.http.services.product-service.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.product-strip.stripprefix.prefixes=/api/products"
      - "traefik.http.routers.product-service.middlewares=product-strip"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "product-service"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    ports:
      - "12201:12201/udp"
    volumes:
      - ./infra/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-net

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - ecommerce-net

volumes:
  user-db-data:
  product-db-data:
  es-data:

